<script>
// --- CREDIT GUARD CLIENT SIDE ---
// Remember credits! Credits: NHTSA + fueleconomy.gov
window._EPA_CREDITS = { total: 100, used: parseInt(localStorage.getItem('epa_credits_used')||'0'), cache: JSON.parse(localStorage.getItem('epa_cache')||'{}') };
function canAffordEPARequest(id, year, make, model){
  // Guard 1: Check cache - 0 credits if cached
  const cacheKey = id || `${year}-${make}-${model}`;
  if (window._EPA_CREDITS.cache[cacheKey]) {
    console.log(`EPA CREDIT GUARD: CACHE HIT ${cacheKey} - 0 credits consumed`);
    return { ok: true, reason: 'CACHE_HIT', cost: 0 };
  }
  // Guard 2: Validate before consuming
  if (id && !/^\d+$/.test(String(id))) return { ok: false, reason: 'INVALID_ID', cost: 0 };
  if (!id && (!year || !make || !model)) return { ok: false, reason: 'MISSING_PARAMS', cost: 0 };
  // Guard 3: Check balance
  if (window._EPA_CREDITS.used >= window._EPA_CREDITS.total) return { ok: false, reason: 'NO_CREDITS', cost: 0 };
  return { ok: true, reason: 'VALID', cost: 1 };
}
function consumeEPACredit(cacheKey, data){
  window._EPA_CREDITS.used += 1;
  window._EPA_CREDITS.cache[cacheKey] = data;
  localStorage.setItem('epa_credits_used', window._EPA_CREDITS.used);
  localStorage.setItem('epa_cache', JSON.stringify(window._EPA_CREDITS.cache));
  console.log(`EPA CREDIT CONSUMED: ${cacheKey} - Used ${window._EPA_CREDITS.used}/${window._EPA_CREDITS.total} - Credits: fueleconomy.gov + NHTSA`);
}


async function fetchEPAWithGuard(id, year, make, model){
  const check = canAffordEPARequest(id, year, make, model);
  const statusEl = document.getElementById('epa-status') || document.getElementById('epa-credits-display');
  if (!check.ok) {
    console.warn(`EPA GUARD BLOCKED: ${check.reason} - 0 credits consumed`);
    if (statusEl) statusEl.textContent = `EPA Guard: ${check.reason} - 0 credits`;
    return window._EPA_CREDITS.cache[id || `${year}-${make}-${model}`] || null;
  }
  // Valid - now fetch via proxy if available, else direct
  try {
    const isNetlify = window.location.hostname.includes('netlify');
    const url = isNetlify ? `/api/epa-proxy?${id ? 'id='+id : `year=${year}&make=${encodeURIComponent(make)}&model=${encodeURIComponent(model)}`}` : `https://www.fueleconomy.gov/ws/rest/vehicle/${id}`;
    const res = await fetch(url);
    const text = await res.text();
    // Simple parse
    const get = (tag) => { const m = text.match(new RegExp(`<${tag}>([^<]+)</${tag}>`)); return m ? m[1] : null; };
    const data = { mpg: get('comb08')||get('comb08U')||get('combA08'), co2: get('co2TailpipeGpm')||get('co2'), cost: get('fuelCost08')||get('fuelCostA08'), raw: text.substring(0,500) };
    const cacheKey = id || `${year}-${make}-${model}`;
    consumeEPACredit(cacheKey, data);
    if (statusEl) statusEl.textContent = `EPA Live: ${data.mpg||'?'} MPG - Credits Used ${window._EPA_CREDITS.used}/${window._EPA_CREDITS.total} - Source: fueleconomy.gov`;
    return data;
  } catch(e){
    console.error('EPA fetch fail, using fallback - 0 credits consumed on network fail', e);
    return null;
  }
}
